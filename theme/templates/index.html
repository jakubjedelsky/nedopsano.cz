<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ SITENAME }}</title>
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/style.css">
  {% if FEED_ALL_ATOM %}
  <link rel="alternate" type="application/atom+xml" title="{{ SITENAME }}"
        href="{{ FEED_DOMAIN }}/{{ FEED_ALL_ATOM }}">
  {% endif %}
</head>
<body>
  <a class="wordmark" href="{{ SITEURL }}/">{{ SITENAME }}</a>

  <main>
    {% for article in articles %}
    <article class="poem" id="{{ article.slug }}">
      <h2>{{ article.title }} <a class="permalink" href="#{{ article.slug }}" aria-label="Odkaz na tuto báseň">#</a></h2>
      {{ article.content }}
      <footer>(<time datetime="{{ article.date.isoformat() }}">{{ article.locale_date }}</time>)</footer>
    </article>
    {% endfor %}
  </main>

  {% if articles|length > 1 %}
  <div class="hint hint-up" aria-hidden="true">&uarr;</div>
  <div class="hint hint-down" aria-hidden="true">&darr;</div>
  {% endif %}
</body>
</html>
